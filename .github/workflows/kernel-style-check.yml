name: Linux kernel style check

# Enforces the Linux kernel coding style on the kmod C sources with
# clang-format, using the vendored .clang-format (a copy of the kernel's own
# config). Every kmod source file that a PR adds or modifies is checked in
# full; files the PR does not touch are left alone.

on:
  # Deliberately no top-level `paths:` filter. This check is a required status
  # check, and a `paths:`-filtered workflow that never starts leaves GitHub
  # waiting forever on a status that never reports, blocking any PR that does
  # not touch `kmods/**` (e.g. build-infra-only PRs). Instead we run on every
  # PR and do the scoping below with dorny/paths-filter: when no kmod source
  # changed, the gated steps are skipped and the job still reports success.
  pull_request:
  # GitHub silently ignores a `paths:` filter on merge_group anyway, so this
  # always runs in the merge queue; the dorny/paths-filter step below does the
  # equivalent scoping and gates the actual check.
  merge_group:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  clang-format:
    name: clang-format (changed files)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v6
        with:
          # The PR head commit (the author's actual code), not the synthetic
          # merge commit.
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          # Full history so dorny/paths-filter can diff against the base to list
          # changed files in both pull_request and merge_group events.
          fetch-depth: 0

      # Emits a boolean (did any kmod source change?) plus the shell-quoted list
      # of changed files. This is also the only path-scoping that works for
      # merge_group events, where the top-level `paths:` filter is ignored.
      - name: Detect changed kmod sources
        uses: dorny/paths-filter@v4
        id: filter
        with:
          list-files: shell
          filters: |
            sources:
              - added|modified: 'kmods/**/*.c'
              - added|modified: 'kmods/**/*.h'

      - name: Install clang-format
        if: steps.filter.outputs.sources == 'true'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang-format
          clang-format --version
          # Fail fast (with a clear message) if the vendored .clang-format is
          # not parseable by the installed clang-format, e.g. it was updated to
          # a kernel revision using options newer than this clang-format knows.
          : | clang-format --style=file --assume-filename=kmods/_validate.c --dump-config >/dev/null

      - name: Check changed files against Linux kernel style
        if: steps.filter.outputs.sources == 'true'
        env:
          CHANGED_FILES: ${{ steps.filter.outputs.sources_files }}
        run: |
          set -euo pipefail
          echo "Checking changed kmod source files (whole file):"
          # Intentionally unquoted: word-split the shell-quoted file list from
          # dorny/paths-filter into one argument per file.
          # shellcheck disable=SC2086
          printf '  %s\n' ${CHANGED_FILES}
          echo

          # Format each changed file in full, in place, then let git decide the
          # verdict. clang-format exits non-zero only on a real error, so under
          # `set -e` a broken file/config fails the step; otherwise `git diff`
          # (clean working tree post-checkout) tells us whether anything was off.
          # shellcheck disable=SC2086
          clang-format --style=file -i ${CHANGED_FILES}

          if git diff --quiet; then
            echo "All changed files conform to the Linux kernel style (.clang-format)."
            exit 0
          fi

          diff_output=$(git diff)
          echo "::error::clang-format found Linux kernel style violations in files changed by this PR."
          echo "${diff_output}"
          {
            echo "### Linux kernel style violations"
            echo
            echo "clang-format wants the following changes in files this PR modifies."
            echo "Apply them locally (from the repo root) with:"
            echo
            echo '```sh'
            echo "clang-format -i ${CHANGED_FILES}"
            echo '```'
            echo
            echo '```diff'
            echo "${diff_output}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
          exit 1
